apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

def publicationGroup = gradle.startParameter.projectProperties['group']
def publicationVersion = gradle.startParameter.projectProperties['version']

if (!publicationGroup || publicationGroup == 'unspecified' ||
        !publicationVersion || publicationVersion == 'unspecified') {
    throw new GradleException('Publishing requires -Pgroup and -Pversion.')
}

group = publicationGroup
version = publicationVersion

android {
    namespace = 'com.bitcoin.securepreferences'
    compileSdk = 34

    defaultConfig {
        minSdk = 23

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release')
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = rootProject.name
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // For @RequiresApi
    implementation 'androidx.appcompat:appcompat:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    // Robolectric environment
    testImplementation 'androidx.test:core:1.4.0'
    androidTestImplementation 'androidx.test:core:1.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    implementation 'com.madgag.spongycastle:core:1.58.0.0'
//    testImplementation group: 'org.hamcrest', name: 'hamcrest', version: '2.2'


    implementation "androidx.security:security-crypto:1.1.0"

    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
repositories {
    mavenCentral()
}
